{% extends "base.html" %}
{% block content %}
<div class="card shadow border-0 p-4 mx-auto" style="max-width: 700px;">
    <h3 class="text-primary fw-bold mb-4" data-translate="sec_b_title">Section B - Deepfake Awareness</h3>
    
    <form method="POST">
        <div class="mb-3">
            <label class="fw-bold mb-1" data-translate="q_heard">Have you heard about deepfakes prior to this study?</label>
            <select class="form-select" name="q_heard" required>
                <option value="" disabled selected data-translate="select_option">Select option...</option>
                <option value="Yes" data-translate="opt_yes">Yes</option>
                <option value="No" data-translate="opt_no">No</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="fw-bold mb-1" data-translate="q_desc">In your own words, describe what a deepfake is:</label>
            <textarea class="form-control" name="q_desc" rows="3" required></textarea>
        </div>

        <div class="d-flex justify-content-between mt-4">
            <a href="/survey/prev" class="btn btn-secondary px-4" data-translate="back_btn">← Back</a>
            <button type="submit" class="btn btn-primary px-4" data-translate="next_btn">Next Page →</button>
        </div>
    </form>
</div>
{% endblock %}
