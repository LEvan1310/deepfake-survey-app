{% extends "base.html" %}
{% block content %}
<div class="card shadow border-0 p-4 mx-auto" style="max-width: 700px;">
    <h3 class="text-primary fw-bold mb-4" data-translate="sec_b_title">Section B - Deepfake Awareness</h3>
    
    <form method="POST">
        <!-- Question 1 -->
        <div class="mb-3">
            <label class="fw-bold mb-1" data-translate="q_heard">Have you heard about deepfakes prior to this study?</label>
            <select class="form-select" name="q_heard" required>
                <option value="" disabled selected data-translate="select_option">Select option...</option>
                <option value="Yes" data-translate="opt_yes">Yes</option>
                <option value="No" data-translate="opt_no">No</option>
            </select>
        </div>

        <!-- Question 2 -->
        <div class="mb-3">
            <label class="fw-bold mb-1" data-translate="q_desc">In your own words, describe what a deepfake is:</label>
            <textarea class="form-control" name="q_desc" rows="3" required></textarea>
        </div>

        <!-- Question 3 -->
        <div class="mb-3">
            <label class="fw-bold mb-1" data-translate="q_suspected">Have you ever suspected seeing a deepfake online?</label>
            <select class="form-select" name="q_suspected" required>
                <option value="" disabled selected data-translate="select_option">Select option...</option>
                <option value="Yes" data-translate="opt_yes">Yes</option>
                <option value="No" data-translate="opt_no">No</option>
            </select>
        </div>

        <!-- Question 4 -->
        <div class="mb-3">
            <label class="fw-bold mb-1" data-translate="q_confidence">How confident are you in identifying deepfakes?</label>
            <select class="form-select" name="q_confidence" required>
                <option value="" disabled selected data-translate="select_option">Select option...</option>
                <option value="High" data-translate="opt_high">High</option>
                <option value="Moderate" data-translate="opt_moderate">Moderate</option>
                <option value="Low" data-translate="opt_low">Low</option>
            </select>
        </div>

        <!-- Checkbox Group -->
        <div class="mb-4">
            <label class="fw-bold mb-2" data-translate="q_signs">Select suspicious signs (check all that apply):</label>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="signs" value="sign_1" id="sign1">
                <label class="form-check-label" for="sign1" data-translate="sign_1">Unnatural lighting</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="signs" value="sign_2" id="sign2">
                <label class="form-check-label" for="sign2" data-translate="sign_2">Audio sync issues</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="signs" value="sign_3" id="sign3">
                <label class="form-check-label" for="sign3" data-translate="sign_3">Weird blinking</label>
            </div>
        </div>

        <!-- Navigation Buttons -->
        <div class="d-flex justify-content-between">
            <a href="/survey/prev" class="btn btn-secondary px-4" data-translate="back_btn">← Back</a>
            <button type="submit" class="btn btn-primary px-4" data-translate="next_btn">Next Page →</button>
        </div>
    </form>
</div>
{% endblock %}
