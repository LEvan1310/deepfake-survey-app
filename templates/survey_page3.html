{% extends "base.html" %}{% block content %}
<div class="card shadow border-0 p-4 survey-card"><h3 class="text-primary fw-bold mb-3" data-translate="sec_c_title">Section C - Pre-Exposure Perception and Political Trust</h3>
<form method="POST">
<div class="mb-3"><label class="fw-bold" data-translate="q_video_authentic">Before seeing the study clips, how often do you think political videos online are authentic?</label><select class="form-select" name="video_real_immediate" required><option value="" disabled selected data-translate="select_option">Select option...</option><option value="Almost always" data-translate="almost_always">Almost always</option><option value="Often" data-translate="often">Often</option><option value="Sometimes" data-translate="sometimes">Sometimes</option><option value="Rarely" data-translate="rarely_auth">Rarely</option><option value="Almost never" data-translate="almost_never">Almost never</option></select></div>
<div class="mb-3"><label class="fw-bold" data-translate="q_media_confidence">How confident are you in judging whether digital political media is authentic?</label><select class="form-select" name="confidence_immediate" required><option value="" disabled selected data-translate="select_option">Select option...</option><option value="Very confident" data-translate="opt_very_high">Very confident</option><option value="Confident" data-translate="opt_high">Confident</option><option value="Neutral" data-translate="opt_moderate">Neither confident nor unconfident</option><option value="Not confident" data-translate="opt_low">Not confident</option><option value="Not confident at all" data-translate="opt_very_low">Not confident at all</option></select></div>
<div class="mb-3"><label class="fw-bold" data-translate="q_deepfake_believability">How believable do you think a well-made political deepfake can be?</label><select class="form-select" name="believability" required><option value="" disabled selected data-translate="select_option">Select option...</option><option value="Very believable" data-translate="very_believable">Very believable</option><option value="Believable" data-translate="believable">Believable</option><option value="Neutral" data-translate="neutral">Neither believable nor unbelievable</option><option value="Unbelievable" data-translate="unbelievable">Unbelievable</option><option value="Very unbelievable" data-translate="very_unbelievable">Very unbelievable</option></select></div>
<div class="mb-3"><label class="fw-bold" data-translate="q_realism">How realistic do you expect modern AI-generated political videos to look?</label><select class="form-select" name="realism" required><option value="" disabled selected data-translate="select_option">Select option...</option><option value="1" data-translate="realism_1">1 - Not realistic</option><option value="2" data-translate="realism_2">2</option><option value="3" data-translate="realism_3">3 - Moderately realistic</option><option value="4" data-translate="realism_4">4</option><option value="5" data-translate="realism_5">5 - Extremely realistic</option></select></div>
<div class="mb-3"><label class="fw-bold" data-translate="q_figure_trust">If a convincing but unverified video shows a political leader saying something controversial, how would it affect your trust in that leader?</label><select class="form-select" name="figure_trustworthiness" required><option value="" disabled selected data-translate="select_option">Select option...</option><option value="Decrease a lot" data-translate="trust_decrease_large">Decrease a lot</option><option value="Decrease somewhat" data-translate="trust_decrease_some">Decrease somewhat</option><option value="No change until verified" data-translate="trust_no_change">No change until verified</option><option value="Increase somewhat" data-translate="trust_increase_some">Increase somewhat</option></select></div>
<div class="mb-3"><label class="fw-bold" data-translate="q_opinion_change">How likely is an unverified political video to change your opinion about a candidate or political figure?</label><select class="form-select" name="opinion_change" required><option value="" disabled selected data-translate="select_option">Select option...</option><option value="Very likely" data-translate="very_likely">Very likely</option><option value="Likely" data-translate="likely">Likely</option><option value="Neutral" data-translate="neither">Neither likely nor unlikely</option><option value="Unlikely" data-translate="unlikely">Unlikely</option><option value="Very unlikely" data-translate="very_unlikely">Very unlikely</option></select></div>
<div class="mb-3"><label class="fw-bold" data-translate="q_voting_influence">How likely could a convincing deepfake influence voters’ decisions?</label><select class="form-select" name="voting_influence" required><option value="" disabled selected data-translate="select_option">Select option...</option><option value="Very likely" data-translate="very_likely">Very likely</option><option value="Likely" data-translate="likely">Likely</option><option value="Neutral" data-translate="neither">Neither likely nor unlikely</option><option value="Unlikely" data-translate="unlikely">Unlikely</option><option value="Very unlikely" data-translate="very_unlikely">Very unlikely</option></select></div>
<div class="mb-3"><label class="fw-bold" data-translate="q_social_trust">How much do you trust political videos shared on social media before checking another source?</label><select class="form-select" name="social_media_trust" required><option value="" disabled selected data-translate="select_option">Select option...</option><option value="A lot" data-translate="trust_a_lot">A lot</option><option value="Some" data-translate="trust_some">Some</option><option value="A little" data-translate="trust_little">A little</option><option value="Not at all" data-translate="trust_none">Not at all</option></select></div>
<div class="mb-3"><label class="fw-bold" data-translate="q_election_concern">How concerned are you that political deepfakes could reduce confidence in election fairness?</label><select class="form-select" name="election_fairness_concern" required><option value="" disabled selected data-translate="select_option">Select option...</option><option value="Very concerned" data-translate="very_concerned">Very concerned</option><option value="Concerned" data-translate="concerned">Concerned</option><option value="Somewhat concerned" data-translate="somewhat_concerned">Somewhat concerned</option><option value="Not concerned" data-translate="not_concerned">Not concerned</option></select></div>
<div class="mb-3"><label class="fw-bold" data-translate="q_election_reduction">Repeated exposure to political deepfakes could make me trust election information less, even when some information is genuine.</label><select class="form-select" name="election_trust_reduction" required><option value="" disabled selected data-translate="select_option">Select option...</option><option value="Strongly agree" data-translate="strongly_agree">Strongly agree</option><option value="Agree" data-translate="agree">Agree</option><option value="Neither" data-translate="neither_agree">Neither agree nor disagree</option><option value="Disagree" data-translate="disagree">Disagree</option><option value="Strongly disagree" data-translate="strongly_disagree">Strongly disagree</option></select></div>
<div class="mb-4"><label class="fw-bold" data-translate="q_war_belief">How much would you trust a dramatic warfare video before it is verified by reliable sources?</label><select class="form-select" name="war_believability" required><option value="" disabled selected data-translate="select_option">Select option...</option><option value="A lot" data-translate="trust_a_lot">A lot</option><option value="Some" data-translate="trust_some">Some</option><option value="A little" data-translate="trust_little">A little</option><option value="Not at all" data-translate="trust_none">Not at all</option></select></div>
<div class="d-flex justify-content-between"><a href="/survey/page2" class="btn btn-secondary" data-translate="back_btn">← Back</a><button class="btn btn-primary" data-translate="next_btn">Next Page →</button></div>
</form></div>{% endblock %}
