        warning_evidence_title:'သတိပေးတံဆိပ် သက်ရောက်မှု အထောက်အထား Dashboard', warning_evidence_desc:'ဤတန်ဖိုးများသည် ကလစ်တစ်ခု AI ဖြင့် ဖန်တီးထားကြောင်း အတိအလင်း ပြောပြပြီးနောက် ယုံကြည်ဖွယ်မှုနှင့် ယုံကြည်မှု ဆက်ကျန်နေသလားကို အနှစ်ချုပ်ပြသည်။', avg_before_belief:'တံဆိပ်မပြမီ ပျမ်းမျှယုံကြည်ဖွယ်မှု', avg_after_belief:'တံဆိပ်ပြပြီးနောက် ပျမ်းမျှယုံကြည်ဖွယ်မှု', avg_before_trust:'တံဆိပ်မပြမီ ပျမ်းမျှယုံကြည်မှု', avg_after_trust:'တံဆိပ်ပြပြီးနောက် ပျမ်းမျှယုံကြည်မှု', continued_belief_rate:'AI တံဆိပ်ပြပြီးနောက် ဆက်လက်ယုံကြည်ဖွယ်ဟု rating ပေးသည့်နှုန်း (≥ 3/5):', continued_belief_note:'ဤတန်ဖိုးကို ဖော်ပြချက်အထောက်အထားအဖြစ်သာ သုံးပါ။ တံဆိပ်ပြပြီးနောက် ယုံကြည်ဖွယ်ဟု ခံစားမှု ကျန်နေခြင်းကို ပြသသော်လည်း အဆိုကို အမှန်ဟု လက်ခံကြောင်း သက်သေမပြပါ။', warning_scale_label:'ပျမ်းမျှ rating (၁–၅)',
        admin_dash_title:'📊 Admin Analytics နှင့် Survey Response Dashboard', total_respondents:'စုစုပေါင်း ဖြေဆိုသူ', videos_evaluated:'စုဆောင်းထားသော ဗီဒီယိုအဖြေ', average_score:'ပျမ်းမျှ Quiz ရမှတ်', answer_distribution:'အစစ်နှင့် AI ဖြေဆိုမှု ခွဲဝေမှု', submissions_table_title:'စစ်တမ်းဖြေဆိုချက်အပြည့်အစုံ', no_responses:'ယခုထိ ဖြေဆိုချက်မရှိသေးပါ။', logout_btn:'ထွက်ရန်', return_home:'← ပင်မစာမျက်နှာသို့', real_answers:'အစစ်ဟုဖြေဆိုမှု', ai_answers:'AI ဟုဖြေဆိုမှု'
      }
    };

    const headerTranslations = {Timestamp:'အချိန်',Name:'အမည်',Age_Group:'အသက်အုပ်စု',Gender:'ကျား/မ',Education_Level:'ပညာရေးအဆင့်',News_Frequency:'သတင်းလိုက်ကြည့်မှု',News_Source:'သတင်းရင်းမြစ်',Watched_Deepfake_Before:'Deepfake ကြည့်ဖူးမှု',Heard_Deepfake:'Deepfake ကြားဖူးမှု',Deepfake_Description:'Deepfake ဖော်ပြချက်',Suspected_Deepfake_Before:'Deepfake သံသယရှိဖူးမှု',Confidence_Identifying:'ခွဲခြားနိုင်မှု ယုံကြည်ချက်',Suspicious_Signs:'သံသယလက္ခဏာ',Political_Video_Authenticity:'နိုင်ငံရေးဗီဒီယို စစ်မှန်မှုအမြင်',Media_Authenticity_Confidence:'မီဒီယာစစ်မှန်မှု ဆုံးဖြတ်နိုင်မှု',Deepfake_Believability:'Deepfake ယုံကြည်ဖွယ်မှု',Physical_Realism:'အစစ်ပုံပေါက်မှု',Political_Leader_Trust:'နိုင်ငံရေးခေါင်းဆောင် ယုံကြည်မှု',Opinion_Change:'အမြင်ပြောင်းနိုင်မှု',Voting_Influence:'မဲပေးမှုသက်ရောက်နိုင်မှု',Social_Media_Trust:'ဆိုရှယ်မီဒီယာ ယုံကြည်မှု',Election_Fairness_Concern:'ရွေးကောက်ပွဲမျှတမှု စိုးရိမ်ချက်',Election_Trust_Reduction:'ရွေးကောက်ပွဲသတင်း ယုံကြည်မှုလျော့',War_News_Believability:'စစ်ရေးသတင်း ယုံကြည်မှု',Post_Warning_Belief:'သတိပေးပြီးနောက် ယုံကြည်ချက်',Post_Warning_Believability:'သတိပေးပြီးနောက် ယုံကြည်ဖွယ်မှု',Post_Warning_Trustworthiness:'သတိပေးပြီးနောက် ယုံကြည်မှု',Warning_Effectiveness:'သတိပေးတံဆိပ်ထိရောက်မှု',Action_After_Warning:'သတိပေးပြီးနောက် လုပ်ဆောင်ချက်',Qual_Real_Or_Fake_Features:'အစစ်/အတု လက္ခဏာအမြင်',Qual_Opinion_Effect:'အမြင်/ယုံကြည်မှု သက်ရောက်မှု',Qual_Warning_Impact:'Fact-check သတိပေးမှု သက်ရောက်မှု',Qual_Recommended_Actions:'အကြံပြုလုပ်ဆောင်ချက်',Section_F_Participation:'Section F ပါဝင်မှု',Video_Score_Correct:'မှန်သည့်အရေအတွက်',Video_Score_Total:'စုစုပေါင်းမေးခွန်း',Video_Score_Percent:'ရမှတ်ရာခိုင်နှုန်း'};

    function toggleTheme(){const h=document.documentElement;const n=h.getAttribute('data-bs-theme')==='dark'?'light':'dark';h.setAttribute('data-bs-theme',n);localStorage.setItem('theme',n)}
    function changeLanguage(lang){localStorage.setItem('lang',lang);applyLanguage(lang);window.dispatchEvent(new CustomEvent('languageChanged',{detail:{lang}}))}
    function applyLanguage(lang){
      const d=translations[lang]||translations.en;
      document.querySelectorAll('[data-translate]').forEach(el=>{const k=el.dataset.translate;if(!(k in d))return; if(el.dataset.translateTarget==='placeholder')el.placeholder=d[k]; else if(el.dataset.translateHtml==='true')el.innerHTML=d[k]; else el.textContent=d[k]});
      document.querySelectorAll('[data-lang-block]').forEach(el=>el.style.display=(el.dataset.langBlock===lang?'':'none'));
      document.querySelectorAll('[data-header-key]').forEach(el=>{const raw=el.dataset.headerKey;if(lang==='my'){const m=raw.match(/^Video_(\d+)_(Classification|Confidence|Trust|Cue)$/); const w=raw.match(/^Warning_(\d+)_(Belief_Before|Trust_Before|Belief_After|Realism|Trust_After|Influence_Removed|Could_Be_True|Realism_Influence|Reaction|Reason)$/); if(m){const t={Classification:'ခွဲခြားချက်',Confidence:'ယုံကြည်ချက်',Trust:'ယုံကြည်မှု',Cue:'အဓိကလက္ခဏာ'};el.textContent=`ဗီဒီယို ${m[1]} - ${t[m[2]]}`}else if(w){const wt={Belief_Before:'တံဆိပ်မပြမီ ယုံကြည်ဖွယ်မှု',Trust_Before:'တံဆိပ်မပြမီ ယုံကြည်မှု',Belief_After:'တံဆိပ်ပြပြီးနောက် ယုံကြည်ဖွယ်မှု',Realism:'အစစ်ပုံပေါက်မှု',Trust_After:'တံဆိပ်ပြပြီးနောက် ယုံကြည်မှု',Influence_Removed:'သက်ရောက်မှုဖယ်ရှားမှု',Could_Be_True:'အချို့အပိုင်းမှန်နိုင်မှု',Realism_Influence:'Realism သက်ရောက်မှု',Reaction:'တုံ့ပြန်မှု',Reason:'အကြောင်းပြချက်'};el.textContent=`သတိပေးစမ်းသပ်မှု ${w[1]} - ${wt[w[2]]}`}else el.textContent=headerTranslations[raw]||raw}else el.textContent=raw});
      document.querySelectorAll('[data-answer]').forEach(el=>{const raw=el.dataset.answer; const map=lang==='my'?{'Real':'အစစ်','AI-Generated':'AI ဖြင့် ဖန်တီးထားသည်','Not sure':'မသေချာ','':'—'}:{}; el.textContent=lang==='my'?(map[raw]||raw):raw});
      document.documentElement.lang=lang==='my'?'my':'en';
    }
    document.addEventListener('DOMContentLoaded',()=>{document.documentElement.setAttribute('data-bs-theme',localStorage.getItem('theme')||'light');applyLanguage(localStorage.getItem('lang')||'en')});
    </script>
</head>
