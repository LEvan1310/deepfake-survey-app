{% extends "base.html" %}{% block content %}
<div class="card shadow border-0 p-4 survey-card"><h3 class="text-primary fw-bold mb-3" data-translate="sec_d_title">Section D - Warning Labels and Fact-Checking</h3>
<div class="alert alert-warning" data-translate="warning_intro">Imagine that a platform adds a clear warning: “This video may be AI-generated or manipulated. Check reliable sources before believing or sharing it.”</div>
<form method="POST">
<div class="mb-3"><label class="fw-bold" data-translate="q_post_warning_belief">After seeing that warning, how likely would you be to believe the video?</label><select class="form-select" name="post_warning_belief" required><option value="" disabled selected data-translate="select_option">Select option...</option><option value="Much less likely" data-translate="much_less">Much less likely</option><option value="Somewhat less likely" data-translate="somewhat_less">Somewhat less likely</option><option value="No change" data-translate="no_change">No change</option><option value="Somewhat more likely" data-translate="somewhat_more">Somewhat more likely</option></select></div>
<div class="mb-3"><label class="fw-bold" data-translate="q_post_warning_believability">How much would the warning reduce the video’s believability?</label><select class="form-select" name="post_warning_believability" required><option value="" disabled selected data-translate="select_option">Select option...</option><option value="Reduce a lot" data-translate="reduce_a_lot">Reduce a lot</option><option value="Reduce somewhat" data-translate="reduce_some">Reduce somewhat</option><option value="Reduce a little" data-translate="reduce_little">Reduce a little</option><option value="Not reduce" data-translate="reduce_none">Not reduce it</option></select></div>
<div class="mb-3"><label class="fw-bold" data-translate="q_post_warning_trust">How would the warning affect your trust in the person or event shown?</label><select class="form-select" name="post_warning_trustworthiness" required><option value="" disabled selected data-translate="select_option">Select option...</option><option value="Lower trust" data-translate="lower_trust">Lower my trust</option><option value="Wait for verification" data-translate="wait_verify">I would wait for verification</option><option value="No effect" data-translate="no_effect">No effect</option></select></div>
<div class="mb-3"><label class="fw-bold" data-translate="q_warning_effectiveness">How effective do you think warning labels are at reducing deepfake misinformation?</label><select class="form-select" name="warning_effectiveness" required><option value="" disabled selected data-translate="select_option">Select option...</option><option value="Very effective" data-translate="very_effective">Very effective</option><option value="Effective" data-translate="effective">Effective</option><option value="Somewhat effective" data-translate="somewhat_effective">Somewhat effective</option><option value="Ineffective" data-translate="ineffective">Ineffective</option></select></div>
<div class="mb-4"><label class="fw-bold" data-translate="q_action_warning">What would you most likely do after seeing a deepfake warning?</label><select class="form-select" name="action_after_warning" required><option value="" disabled selected data-translate="select_option">Select option...</option><option value="Verify other sources" data-translate="verify_sources">Check other reliable sources</option><option value="Avoid sharing" data-translate="stop_share">Avoid sharing the video</option><option value="Report/flag" data-translate="report_content">Report or flag the content</option><option value="Continue believing" data-translate="continue_believe">Continue believing it without checking</option><option value="Ignore warning" data-translate="ignore_warning">Ignore the warning</option></select></div>
<div class="d-flex justify-content-between"><a href="/survey/page3" class="btn btn-secondary" data-translate="back_btn">← Back</a><button class="btn btn-primary" data-translate="continue_video">Continue to Educational Video & Quiz →</button></div>
</form></div>{% endblock %}
